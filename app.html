<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download — ModdedApks.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
  <div class="shell">
    <div class="brand"><span class="dot"></span>ModdedApks<small>.io</small></div>
    <nav class="site">
      <a href="index.html">Apps</a>
      <a href="app.html" class="active">Downloads</a>
      <a href="todo.html">To-Do</a>
    </nav>
  </div>
</header>

<main class="shell" id="main">
  <!-- filled by script -->
</main>

<footer class="site">
  <div class="shell">ModdedApks.io — self-hosted app catalogue</div>
</footer>

<script src="assets/store.js"></script>
<script src="assets/main.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const app = id ? getAppById(id) : null;
  const main = document.getElementById("main");

  if (!app) {
    const all = getApps();
    main.innerHTML = `
      <section class="hero">
        <span class="eyebrow">Downloads</span>
        <h1>Pick an app to see its download links.</h1>
        <p class="lede">Choose one from the catalogue below — each app page lists its version, size, and up to three download mirrors.</p>
      </section>
      <div class="grid">${ all.length ? all.map(renderAppCard).join("") : '<div class="empty"><div class="glyph">▢</div>No apps published yet.</div>' }</div>
    `;
  } else {
    main.innerHTML = `
      <div class="detail-head">
        <div class="icon-wrap">${escapeHtml(app.icon || app.name.slice(0,2).toUpperCase())}</div>
        <div>
          <h1>${escapeHtml(app.name)}</h1>
          <div class="sub">${escapeHtml(app.description || app.tagline || "")}</div>
        </div>
      </div>

      <div class="manifest-panel">
        <div class="title-bar">package manifest</div>
        <div class="rows">
          <div><span class="k">Version</span><span class="v">${escapeHtml(app.version || "")}</span></div>
          <div><span class="k">Size</span><span class="v">${escapeHtml(app.size || "")}</span></div>
          <div><span class="k">Package ID</span><span class="v">${escapeHtml(app.packageId || "")}</span></div>
          <div><span class="k">Requires</span><span class="v">${escapeHtml(app.minSdk || "")}</span></div>
          <div><span class="k">Updated</span><span class="v">${escapeHtml(app.updated || "")}</span></div>
        </div>
      </div>

      <div class="downloads">
        <h2>Download</h2>
        <div class="dl-list">
          ${(app.downloads && app.downloads.length ? app.downloads : []).map((d, i) => `
            <a class="dl-btn ${i === 0 ? 'primary' : ''}" href="${escapeHtml(d.url || '#')}">
              <div>
                <div class="label">${escapeHtml(d.label || ('Download ' + (i+1)))}</div>
                <div class="tag">${i === 0 ? 'recommended' : 'mirror'}</div>
              </div>
              <div class="go">GET →</div>
            </a>
          `).join("") || '<div class="empty">No download links added yet.</div>'}
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
